name: Games

# Assembles one build kit per snesrev port, in CI, from a pinned commit: the source, the same TCC
# and SDL2 the port's own run_with_tcc.bat names, an embedded Python with pinned packages where the
# port's asset step needs one, and a build.cmd with the exact compile line. CI compiles a copy of
# the kit to prove it builds, then ships the kit WITHOUT the compiled game: the user's machine runs
# build.cmd on the same bytes everyone else gets. No game binaries are hosted here.
#
# snesrev stopped in 2023, so the pins never move unless someone changes them here on purpose.

on:
  workflow_call:
    inputs:
      upload_to:
        description: release tag to attach the zips to (empty = artifacts only)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      upload_to:
        description: release tag to attach the zips to (empty = artifacts only)
        type: string
        default: ''
  pull_request:
    paths:
      - .github/workflows/games.yml

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_EMBED: https://www.python.org/ftp/python/3.11.1/python-3.11.1-embed-amd64.zip
  GET_PIP: https://bootstrap.pypa.io/get-pip.py

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: zelda3
            repo: snesrev/zelda3
            commit: fbbb3f967a51fafe642e6140d0753979e73b4090
            exe: zelda3.exe
            ini: zelda3.ini
            tcc: https://github.com/FitzRoyX/tinycc/releases/download/tcc_20221020/tcc_20221020.zip
            sdl: 2.26.3
            sources: src/*.c snes/*.c third_party/gl_core/gl_core_3_1.c third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c
            python: true
            pip: Pillow==11.3.0 PyYAML==6.0.2
          - dir: sm
            repo: snesrev/sm
            commit: 578f90b3cc49557bb70060ad033bb90b8cf8ac50
            exe: sm.exe
            ini: sm.ini
            tcc: https://github.com/FitzRoyX/tinycc/releases/download/tcc_20221020/tcc_20221020.zip
            sdl: 2.24.1
            sources: src/*.c src/snes/*.c third_party/gl_core/gl_core_3_1.c
            python: false
            pip: ''
          - dir: smw
            repo: snesrev/smw
            commit: eae20c65c58930c8b62c76188d259579ad4130f1
            exe: smw.exe
            ini: smw.ini
            tcc: https://github.com/FitzRoyX/tinycc/releases/download/tcc_20230519/tcc_20230519.zip
            sdl: 2.28.1
            sources: src/*.c src/snes/*.c third_party/gl_core/gl_core_3_1.c smb1/*.c smbll/*.c
            python: true
            pip: ''
    name: ${{ matrix.dir }}
    steps:
      - name: Source at the pinned commit
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/${{ matrix.repo }}/archive/${{ matrix.commit }}.zip" -OutFile src.zip
          Expand-Archive src.zip -DestinationPath srcroot
          Move-Item (Get-ChildItem srcroot -Directory | Select-Object -First 1).FullName game

      - name: TCC and SDL2
        shell: pwsh
        working-directory: game
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          Invoke-WebRequest "${{ matrix.tcc }}" -OutFile tcc.zip
          Expand-Archive tcc.zip -DestinationPath third_party -Force
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-${{ matrix.sdl }}/SDL2-devel-${{ matrix.sdl }}-VC.zip" -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath third_party -Force
          Get-ChildItem third_party

      # The kit: source at the pinned commit, TCC, SDL2, the port's own asset scripts, an embedded
      # Python with its packages where the asset step needs one, and build.cmd: the exact compile
      # line from the port's run_with_tcc.bat. No compiled game is shipped; the user's machine runs
      # build.cmd on these same bytes.
      - name: Assemble the kit
        shell: pwsh
        run: |
          $out = "kit"
          Copy-Item game $out -Recurse
          Remove-Item "$out/.github" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$out/*.zip" -Force -ErrorAction SilentlyContinue
          if ('${{ matrix.python }}' -eq 'true') {
            Invoke-WebRequest $env:PYTHON_EMBED -OutFile py.zip
            Expand-Archive py.zip -DestinationPath "$out/python"
            if ('${{ matrix.pip }}' -ne '') {
              # The embeddable build ignores site-packages until "import site" is enabled in its ._pth.
              $pth = Get-ChildItem "$out/python/python*._pth" | Select-Object -First 1
              (Get-Content $pth) -replace '^#import site$', 'import site' | Set-Content $pth
              Invoke-WebRequest $env:GET_PIP -OutFile get-pip.py
              & "$out/python/python.exe" get-pip.py --no-warn-script-location
              & "$out/python/python.exe" -m pip install --no-warn-script-location ${{ matrix.pip }}
            }
          }
          @"
          @echo off
          rem Built by the snesrev launcher. Same line as run_with_tcc.bat at ${{ matrix.repo }}@${{ matrix.commit }}, without the run.
          set SDL2=third_party\SDL2-${{ matrix.sdl }}
          third_party	cc	cc.exe -o${{ matrix.exe }} -DCOMPILER_TCC=1 -DSTBI_NO_SIMD=1 -DHAVE_STDINT_H=1 -D_HAVE_STDINT_H=1 -DSYSTEM_VOLUME_MIXER_AVAILABLE=0 -I%SDL2%/include -L%SDL2%/lib/x64 -lSDL2 -I. ${{ matrix.sources }}
          if errorlevel 1 exit /b 1
          copy /Y %SDL2%\libd\SDL2.dll .
          "@ | Set-Content "$out/build.cmd" -Encoding ascii
          "snesrev ${{ matrix.repo }} @ ${{ matrix.commit }}`nTCC ${{ matrix.tcc }}`nSDL2 ${{ matrix.sdl }}`nassembled by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content "$out/KIT.txt"

      # Prove the kit builds: compile a copy of it with build.cmd and start the exe. The compiled
      # game is thrown away; only the kit ships.
      - name: Verify the kit builds
        shell: pwsh
        run: |
          Copy-Item kit verify -Recurse
          Push-Location verify
          cmd /c build.cmd
          if ($LASTEXITCODE -ne 0) { throw "build.cmd failed" }
          if (-not (Test-Path "${{ matrix.exe }}")) { throw "no ${{ matrix.exe }} produced" }
          $p = Start-Process -FilePath ".\${{ matrix.exe }}" -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; "started and kept running without a ROM: fine" } else { "exited with $($p.ExitCode) without a ROM: fine" }
          Pop-Location
          Compress-Archive "kit/*" "${{ matrix.dir }}-win-x64.zip"
          Get-Item "${{ matrix.dir }}-win-x64.zip" | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.dir }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}-win-x64
          path: ${{ matrix.dir }}-win-x64.zip
          retention-days: 14

      - name: Attach to the release
        if: ${{ inputs.upload_to != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.upload_to }}" "${{ matrix.dir }}-win-x64.zip" --clobber --repo "$env:GITHUB_REPOSITORY"
